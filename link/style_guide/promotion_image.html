<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>루카랩X케어베어</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap');

        html { scroll-behavior: smooth; }
        body { margin: 0; padding: 0; overflow-x: hidden; background: #0d0d0d; min-width: 320px; font-family: 'Noto Sans KR', sans-serif; }
        #wrap { width: 1200px; margin: 0 auto; }
        img { display: block; width: 100%; }
        .btn { position: fixed; right: 351px; bottom: 0; transform: translateX(60px); }
        .btn a { text-decoration: none; color: #fff; display: block; width: 60px; padding: 20px 0; text-align: center; }
        .btn a.view { background: #545740; font-size: 14px; }
        .btn a.gotop { background: #C487FF; }
        .styleguide {background: #fff;}
        .info {background: #2c2c2c; padding:10px 20px; font-size: 14px; color: #999; border-top: 1px solid #4c4c4c; }
        .info > p {white-space: pre;}
        
    </style>
</head>
<body>
    <a name="top"></a>
    <div id="wrap">
        <div class="btn">
            <a href="#top" class="gotop">↑</a>
        </div>

        <div class="styleguide">
            <img src="../style_guide/images/lucalab/promo_image.jpg"alt="lucalab"> <!-- 스타일가이드 이미지 삽입 -->
        </div>


        </div>
    </div>
</body>
</html>
